<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Localizador de Unidades | Grupo Mais Barato</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070709;
      color: #FFFFFF;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    /* SEÇÃO LOCALIZADOR DE LOJAS */
    .store-locator-gold-section {
      background: #0C0C0D;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .store-locator-grid {
      display: grid;
      grid-template-columns: 38% 62%;
      gap: 32px;
      align-items: stretch;
    }

    .store-left-col {
      display: flex;
      flex-direction: column;
    }

    .store-right-col {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* CABEÇALHO & TIPOGRAFIA */
    .eyebrow-gold {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #c59b27;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .locator-gold-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.8rem, 2.5vw, 2.4rem);
      font-weight: 400;
      color: #FFFFFF;
      line-height: 1.15;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .locator-gold-title .headline-highlight-italic {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 400;
      font-style: italic;
      color: #d8a72b;
    }

    .locator-gold-desc {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 20px;
    }

    /* CAMPO DE BUSCA */
    .locator-search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(18, 18, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 18px;
      width: 100%;
      transition: border-color 0.2s ease;
    }

    .locator-search-box:focus-within {
      border-color: #c59b27;
    }

    .locator-search-box input {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-size: 0.9rem;
      width: 100%;
      padding-right: 30px;
      outline: none;
      font-family: inherit;
    }

    .locator-search-box input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .locator-search-box .search-icon-svg {
      position: absolute;
      right: 16px;
      width: 18px;
      height: 18px;
      color: #c59b27;
      fill: #c59b27;
      pointer-events: none;
    }

    /* LISTA DE CARDS */
    .store-cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      max-height: 480px;
      padding-right: 4px;
    }

    /* Scrollbar estilizada */
    .store-cards-list::-webkit-scrollbar {
      width: 6px;
    }
    .store-cards-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 3px;
    }
    .store-cards-list::-webkit-scrollbar-thumb {
      background: rgba(197, 155, 39, 0.4);
      border-radius: 3px;
    }

    /* CARD DE UNIDADE */
    .gold-unit-card {
      display: flex;
      background: #0D0D0E;
      border: 1px solid rgba(197, 155, 39, 0.22);
      border-radius: 14px;
      overflow: hidden;
      padding: 14px;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
    }

    .gold-unit-card:hover,
    .gold-unit-card.active {
      border-color: #c59b27;
      background: #141416;
      box-shadow: 0 4px 20px rgba(197, 155, 39, 0.2);
    }

    .unit-card-thumb {
      width: 95px;
      height: 82px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .unit-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .unit-card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .unit-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .unit-card-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #c59b27;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .unit-card-rating {
      font-size: 0.8rem;
      font-weight: 800;
      color: #c59b27;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .unit-subbrands-inline-row {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      line-height: 1.3;
      margin: 2px 0;
    }

    .unit-subbrands-inline-row .tag-divider {
      color: rgba(255, 255, 255, 0.3);
      margin: 0 4px;
      font-weight: 400;
    }

    .unit-card-addr {
      font-size: 0.78rem;
      color: #FFFFFF;
      font-weight: 500;
      line-height: 1.35;
      margin: 0 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .unit-card-addr svg {
      flex-shrink: 0;
    }

    .store-card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
    }

    .btn-unit-ver-mais {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.66rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-unit-ver-mais:hover {
      background: #FFFFFF;
      color: #000000;
      border-color: #FFFFFF;
    }

    /* MAPA */
    .gold-map-wrapper {
      width: 100%;
      height: 100%;
      min-height: 480px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .panel-map {
      width: 100%;
      height: 100%;
      min-height: 480px;
    }

    /* CUSTOM LEAFLET PINS */
    .custom-map-pin-container {
      background: transparent !important;
      border: none !important;
      overflow: visible !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .custom-pin-wrapper {
      position: relative;
      width: 40px;
      height: 54px;
      transform-origin: bottom center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
    }

    .custom-pin-wrapper:hover,
    .custom-pin-wrapper.active {
      transform: scale(1.18);
      filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.75)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
      z-index: 1000 !important;
    }

    .custom-pin-svg {
      width: 40px;
      height: 54px;
      display: block;
    }

    /* CONTROLES DE ZOOM CUSTOMIZADOS */
    .gold-map-wrapper .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25) !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      margin-top: 20px !important;
      margin-left: 20px !important;
    }

    .gold-map-wrapper .leaflet-control-zoom-in,
    .gold-map-wrapper .leaflet-control-zoom-out {
      background-color: #FFFFFF !important;
      color: #000000 !important;
      border: none !important;
      border-bottom: 1px solid #E5E5E5 !important;
      width: 32px !important;
      height: 32px !important;
      line-height: 32px !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      transition: background 0.2s ease !important;
    }

    .gold-map-wrapper .leaflet-control-zoom-out {
      border-bottom: none !important;
    }

    .gold-map-wrapper .leaflet-control-zoom-in:hover,
    .gold-map-wrapper .leaflet-control-zoom-out:hover {
      background-color: #F4F4F4 !important;
      color: #000000 !important;
    }

    /* RESPONSIVIDADE */
    @media (max-width: 980px) {
      .store-locator-gold-section {
        padding: 24px 16px;
        border-radius: 18px;
      }
      .store-locator-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .gold-map-wrapper,
      .panel-map {
        min-height: 340px;
        height: 340px;
        border-radius: 16px;
      }
    }

    @media (max-width: 640px) {
      .store-locator-gold-section {
        padding: 20px 12px;
      }
      .locator-gold-title {
        font-size: 1.55rem;
      }
      .gold-unit-card {
        padding: 10px 12px;
        gap: 10px;
        border-radius: 12px;
        align-items: stretch;
      }
      .unit-card-thumb {
        width: 78px;
        height: 78px;
        min-width: 78px;
        max-width: 78px;
        align-self: center;
      }
      .unit-card-info {
        justify-content: space-between;
        gap: 2px;
      }
      .unit-card-header {
        align-items: flex-start;
        gap: 6px;
      }
      .unit-card-title {
        font-size: 0.78rem;
        line-height: 1.25;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .unit-card-rating {
        font-size: 0.74rem;
        flex-shrink: 0;
      }
      .unit-subbrands-inline-row {
        font-size: 0.56rem;
        line-height: 1.3;
        margin: 1px 0 2px 0;
      }
      .unit-card-addr {
        font-size: 0.72rem;
        margin: 0 0 2px;
      }
      .btn-unit-ver-mais {
        padding: 3px 8px;
        font-size: 0.60rem;
        border-radius: 5px;
      }
      .gold-map-wrapper,
      .panel-map {
        min-height: 290px;
        height: 290px;
        border-radius: 14px;
      }
    }

    @media (max-width: 380px) {
      .gold-unit-card {
        padding: 8px 10px;
        gap: 8px;
      }
      .unit-card-thumb {
        width: 66px;
        height: 66px;
        min-width: 66px;
        max-width: 66px;
      }
      .unit-card-title {
        font-size: 0.74rem;
      }
      .unit-subbrands-inline-row {
        font-size: 0.52rem;
      }
      .unit-card-addr {
        font-size: 0.68rem;
      }
      .btn-unit-ver-mais {
        padding: 3px 6px;
        font-size: 0.56rem;
      }
      .gold-map-wrapper,
      .panel-map {
        min-height: 250px;
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ===== SEÇÃO LOCALIZADOR DE UNIDADES ===== -->
    <div class="store-locator-gold-section" id="store-locator-teaser">
      <div class="store-locator-grid">
        
        <!-- Coluna Esquerda: Busca + Lista de Unidades -->
        <div class="store-left-col">
          <span class="eyebrow-gold">NOSSAS UNIDADES</span>
          <h2 class="locator-gold-title">Encontre <span class="headline-highlight-italic">nossas unidades</span></h2>
          <p class="locator-gold-desc">Lojas, serviços e experiências mais perto de você.</p>

          <!-- Input de Busca -->
          <div class="locator-search-box">
            <input type="text" id="teaser-search-input" placeholder="Buscar unidade ou endereço" autocomplete="off">
            <svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </div>

          <!-- Lista Dinâmica de Cards de Unidades -->
          <div class="store-cards-list" id="teaser-stores-list-container">
            <!-- Cards serão inseridos / filtrados via JS -->
          </div>
        </div>

        <!-- Coluna Direita: Mapa Interativo Leaflet -->
        <div class="store-right-col">
          <div class="gold-map-wrapper">
            <div id="teaser-unidades-map" class="panel-map"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Banco de Dados das Unidades (com fallbacks de imagem locais e remotos)
    const unitsData = [
      {
        id: "alcindo",
        name: "+B SUPERMERCADOS (ALCINDO CACELA)",
        shortName: "Alcindo Cacela",
        coords: [-1.4516, -48.4779],
        address: "Av. Alcindo Cacela, 1848",
        googleMapsUrl: "https://maps.app.goo.gl/BUbRXApXKgTSYXKG8",
        rating: 4.8,
        subbrands: ["SUPERMERCADOS +B", "THE WINE EXPERIENCE", "+B FARMA"],
        thumbLocal: "./assets/Fotografias/Supermercado +B/00_CardHome/1-foto-supermercado.webp",
        thumbOnline: "https://grupomaisb.suporteide.digital/assets/Fotografias/Supermercado%20+B/00_CardHome/1-foto-supermercado.webp"
      },
      {
        id: "tapana",
        name: "+B SUPERMERCADOS (TAPANÃ)",
        shortName: "Tapanã",
        coords: [-1.353381, -48.468711],
        address: "Rod. Tapanã, 597",
        googleMapsUrl: "https://maps.app.goo.gl/aKm2MGrDTNMum9nk7",
        rating: 4.5,
        subbrands: ["SUPERMERCADOS +B", "+B FARMA"],
        thumbLocal: "./assets/Fotografias/Supermercado +B/00_CardHome/2-foto-supermercado.webp",
        thumbOnline: "https://grupomaisb.suporteide.digital/assets/Fotografias/Supermercado%20+B/00_CardHome/2-foto-supermercado.webp"
      },
      {
        id: "plaza",
        name: "+B SUPERMERCADOS (PLAZA)",
        shortName: "Plaza",
        coords: [-1.448574, -48.473539],
        address: "Av. Gov. José Malcher, 2388",
        googleMapsUrl: "https://maps.app.goo.gl/wHYfn9JPun4pZ28Z8",
        rating: 4.7,
        subbrands: ["SUPERMERCADOS +B", "VILLA PLAZA", "VILLA PLAZA PARK", "+B FARMA"],
        thumbLocal: "./assets/Fotografias/Supermercado +B/00_CardHome/3-foto-supermercado.webp",
        thumbOnline: "https://grupomaisb.suporteide.digital/assets/Fotografias/Supermercado%20+B/00_CardHome/3-foto-supermercado.webp"
      }
    ];

    let map = null;
    const markersMap = {};

    // Criar Pin SVG Customizado do +B
    function createCustomPinIcon(unit) {
      return L.divIcon({
        className: `custom-map-pin-container pin-${unit.id}`,
        html: `
          <div class="custom-pin-wrapper" id="pin-wrapper-${unit.id}">
            <svg class="custom-pin-svg" viewBox="0 0 40 54" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="gold-grad-${unit.id}" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFF099"/>
                  <stop offset="50%" stop-color="#F5C400"/>
                  <stop offset="100%" stop-color="#C59B27"/>
                </linearGradient>
              </defs>
              <path class="pin-base-path" d="M20 0C8.95 0 0 8.95 0 20c0 14.5 18.2 32.2 19.1 33.1a1.4 1.4 0 0 0 1.8 0C21.8 52.2 40 34.5 40 20 40 8.95 31.05 0 20 0z" fill="#0C0C0D" stroke="#333333" stroke-width="1.2" />
              <circle cx="20" cy="20" r="13" fill="#050505" />
              <text x="20" y="25" font-family="'DM Sans', sans-serif" font-size="14" font-weight="900" font-style="italic" fill="url(#gold-grad-${unit.id})" text-anchor="middle">+B</text>
            </svg>
          </div>
        `,
        iconSize: [40, 54],
        iconAnchor: [20, 54]
      });
    }

    // Renderizar Lista de Cards
    function renderCards(units) {
      const container = document.getElementById('teaser-stores-list-container');
      container.innerHTML = '';

      if (units.length === 0) {
        container.innerHTML = `<p style="color: rgba(255,255,255,0.5); font-size: 0.85rem; padding: 10px;">Nenhuma unidade encontrada.</p>`;
        return;
      }

      units.forEach(unit => {
        const subbrandsHTML = unit.subbrands.join(' <span class="tag-divider">|</span> ');

        const cardHTML = `
          <div class="gold-unit-card" id="card-${unit.id}" onclick="selectUnit('${unit.id}')">
            <div class="unit-card-thumb">
              <img src="${unit.thumbLocal}" alt="${unit.name}" onerror="this.onerror=null; this.src='${unit.thumbOnline}';">
            </div>
            <div class="unit-card-info">
              <div class="unit-card-header">
                <h4 class="unit-card-title">${unit.name}</h4>
                <span class="unit-card-rating">★ ${unit.rating.toString().replace('.', ',')}</span>
              </div>
              <div class="unit-subbrands-inline-row">
                ${subbrandsHTML}
              </div>
              <p class="unit-card-addr">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${unit.address}
              </p>
              <div class="store-card-footer">
                <a href="${unit.googleMapsUrl}" target="_blank" rel="noopener" class="btn-unit-ver-mais" onclick="event.stopPropagation();">VER NO GOOGLE MAPS</a>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    // Inicializar Mapa Leaflet
    function initMap() {
      const mapContainer = document.getElementById('teaser-unidades-map');
      if (!mapContainer) return;

      map = L.map('teaser-unidades-map', {
        center: [-1.448, -48.472],
        zoom: 12.5,
        zoomControl: true,
        scrollWheelZoom: false,
        attributionControl: false
      });

      // Camada de Tiles Suave CartoDB Light
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // Ativar zoom por scroll ao interagir
      mapContainer.addEventListener('click', () => map.scrollWheelZoom.enable());
      mapContainer.addEventListener('mouseleave', () => map.scrollWheelZoom.disable());

      // Adicionar Marcadores no Mapa
      unitsData.forEach(unit => {
        const marker = L.marker(unit.coords, {
          icon: createCustomPinIcon(unit)
        }).addTo(map);

        markersMap[unit.id] = marker;

        marker.on('click', () => {
          selectUnit(unit.id);
        });
      });
    }

    // Selecionar Unidade (Card + Pin no Mapa)
    function selectUnit(unitId) {
      const unit = unitsData.find(u => u.id === unitId);
      if (!unit) return;

      // Centralizar Mapa na Loja
      if (map) {
        map.flyTo(unit.coords, 15, { duration: 1.2 });
      }

      // Atualizar classe ativa nos Cards
      document.querySelectorAll('.gold-unit-card').forEach(card => card.classList.remove('active'));
      const activeCard = document.getElementById(`card-${unitId}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Atualizar classe ativa nos Pins
      document.querySelectorAll('.custom-pin-wrapper').forEach(pin => pin.classList.remove('active'));
      const activePin = document.getElementById(`pin-wrapper-${unitId}`);
      if (activePin) {
        activePin.classList.add('active');
      }
    }

    // Lógica da Busca em Tempo Real
    function initSearch() {
      const searchInput = document.getElementById('teaser-search-input');
      if (!searchInput) return;

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();

        const filtered = unitsData.filter(u => 
          u.name.toLowerCase().includes(query) ||
          u.address.toLowerCase().includes(query) ||
          u.subbrands.some(sb => sb.toLowerCase().includes(query))
        );

        renderCards(filtered);

        // Atualizar visibilidade dos marcadores no mapa
        unitsData.forEach(u => {
          const isMatch = filtered.some(f => f.id === u.id);
          if (markersMap[u.id]) {
            if (isMatch) {
              if (!map.hasLayer(markersMap[u.id])) markersMap[u.id].addTo(map);
            } else {
              if (map.hasLayer(markersMap[u.id])) map.removeLayer(markersMap[u.id]);
            }
          }
        });
      });
    }

    // Executar ao Carregar a Página
    document.addEventListener('DOMContentLoaded', () => {
      renderCards(unitsData);
      initMap();
      initSearch();
    });
  </script>
</body>
</html>
