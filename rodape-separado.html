<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodapé Minimalista - Grupo Mais Barato</title>
  
  <!-- Fonte Google (DM Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ESTILOS DO RODAPÉ MINIMALISTA (TUDO INLINE / EMBUTIDO NO HTML)
       ========================================================================== */

    /* Reset Básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #030303;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Container Principal do Rodapé */
    .footer-minimal-glow-section {
      background: #060607;
      padding: 60px 20px 24px 20px;
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
    }

    /* Efeito de Ponto de Luz Ambiental Dourado/Suave (Ambient Radial Glow) */
    .footer-minimal-glow-section::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 300px;
      background: radial-gradient(
        ellipse 60% 50% at 50% 70%,
        rgba(212, 160, 23, 0.28) 0%,
        rgba(180, 130, 20, 0.14) 40%,
        rgba(120, 80, 10, 0.04) 65%,
        transparent 85%
      );
      filter: blur(38px);
      pointer-events: none;
      z-index: 1;
    }

    .footer-minimal-container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Bloco Central: Logo + Slogan + Redes Sociais */
    .footer-minimal-centered-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 45px;
    }

    .footer-logo-glow-wrapper {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-minimal-logo {
      max-width: 130px;
      height: auto;
      position: relative;
      z-index: 2;
      display: block;
    }

    .footer-minimal-slogan {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 26px;
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    /* Linha de Ícones Sociais Circular */
    .footer-minimal-social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .social-circle-minimal {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.02);
      text-decoration: none;
    }

    .social-circle-minimal:hover {
      border-color: #c59b27;
      color: #c59b27;
      transform: translateY(-2px);
      box-shadow: 0 0 14px rgba(197, 155, 39, 0.35);
      background: rgba(197, 155, 39, 0.05);
    }

    /* Barra Inferior em 3 Colunas com Linha Iluminada Central */
    .footer-minimal-bottom-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      position: relative;
      z-index: 2;
    }

    /* Ponto de luz no centro da linha divisória */
    .footer-minimal-bottom-bar::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #ffe082 50%, transparent 100%);
      box-shadow: 0 0 5px rgba(255, 210, 80, 0.9);
      pointer-events: none;
      z-index: 3;
    }

    .footer-minimal-bottom-bar .copyright-left {
      justify-self: start;
    }

    .footer-minimal-bottom-bar .legal-center {
      justify-self: center;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .footer-minimal-bottom-bar .legal-center:hover {
      color: #FFFFFF;
    }

    .footer-minimal-bottom-bar .dev-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .idedigital-logo-img {
      height: 16px;
      width: auto;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
      vertical-align: middle;
      display: block;
    }

    .dev-right a:hover .idedigital-logo-img {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Responsividade para Celulares e Tablets */
    @media (max-width: 850px) {
      .footer-minimal-bottom-bar {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 14px;
        text-align: center;
      }
      
      .footer-minimal-bottom-bar .copyright-left,
      .footer-minimal-bottom-bar .legal-center,
      .footer-minimal-bottom-bar .dev-right {
        justify-self: center;
      }

      .footer-minimal-glow-section::before {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>
